services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creche
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: creche
    # Só na loopback. Publicado em 0.0.0.0, o banco que guarda CPF e nome de criança
    # fica alcançável por qualquer um na mesma rede — café, coworking, wifi de evento.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
