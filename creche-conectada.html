<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Creche Conectada: painel da fila de creche do Rio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Painel da rede municipal de educação infantil do Rio: os CSVs do estudo Fila de Creche (SME/IPP, base 2025), as contas que o bot faz sobre eles e o que a conversa grava no banco.">
<!-- A fonte é enfeite: sem rede a página cai em system-ui e nada mais muda. Antes o
     stack pedia 'Raleway' sem nunca carregá-la, declaração que não fazia nada. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&amp;display=swap">
<style>
/* ---------------------------------------------------------------------------
   Tokens: gov.br Design System (@govbr-ds/core) para a interface; rampas de
   dataviz derivadas das mesmas famílias de cor e validadas para daltonismo
   (violeta #8168b3 x verde #168821: ΔE deutan 19,1 · normal 27,8 · contraste
   ≥3:1 nas duas superfícies). Nada de arco-íris, nada de eixo duplo.
   --------------------------------------------------------------------------- */
:root{
  color-scheme: light;
  --bg:#f8f8f8; --surface:#ffffff; --surface-2:#f3f3f3; --surface-3:#ececec;
  --ink:#1b1b1b; --ink-soft:#555555; --ink-faint:#757575;
  --border:#e6e6e6; --border-strong:#d4d4d4;
  --brand:#1351b4; --brand-strong:#112f4e; --brand-soft:#c5d4eb; --brand-tint:#f4f7fc;
  --fila:#8168b3; --fila-strong:#4c3d69; --fila-tint:#ebe3f9;
  --ociosa:#168821; --ociosa-strong:#0d6318; --ociosa-tint:#e3f5e1;
  --alerta:#a15c00; --alerta-tint:#fff5c2;
  --perigo:#b8280b; --perigo-tint:#fde0db;
  --neutro-mapa:#d9d9d9;
  /* base do mapa: água, terra do município, vizinhança, costa e rótulo de água */
  --mapa-agua:#d5e2ec; --mapa-terra:#ffffff; --mapa-vizinho:#dbd9d1;
  --mapa-vizinho-linha:#cac8bf; --mapa-costa:#8b9ba7; --mapa-rotulo:#748ea3;
  --mapa-relevo:rgba(31,45,58,.20);
  --sombra:0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  /* rampas sequenciais, L(OKLCH) estritamente decrescente */
  --r-fila-0:#f3eefb; --r-fila-1:#ddd0f0; --r-fila-2:#bda9de; --r-fila-3:#9a7fc7;
  --r-fila-4:#7a5cab; --r-fila-5:#5b4383; --r-fila-6:#40305c;
  --r-oci-0:#eef7ec; --r-oci-1:#cfe7c9; --r-oci-2:#a4d29a; --r-oci-3:#6fb763;
  --r-oci-4:#3f9c35; --r-oci-5:#168821; --r-oci-6:#0d6318;
  --r-azul-0:#eaf1fb; --r-azul-1:#c5d4eb; --r-azul-2:#8fb0dd; --r-azul-3:#5b8ac9;
  --r-azul-4:#2f66b5; --r-azul-5:#1351b4; --r-azul-6:#112f4e;
}
:root[data-tema="escuro"]{
  color-scheme: dark;
  --bg:#141413; --surface:#1e1e1d; --surface-2:#262625; --surface-3:#303030;
  --ink:#f0efe9; --ink-soft:#c2c1ba; --ink-faint:#95948d;
  --border:#33332f; --border-strong:#46463f;
  --brand:#6aa6e8; --brand-strong:#9cc6f2; --brand-soft:#1f3a5c; --brand-tint:#182432;
  --fila:#9a7fc7; --fila-strong:#c6aeea; --fila-tint:#2a2140;
  --ociosa:#3f9c35; --ociosa-strong:#86d476; --ociosa-tint:#122c17;
  --alerta:#e0a93a; --alerta-tint:#3a2f11;
  --perigo:#f08a72; --perigo-tint:#3b1a12;
  --neutro-mapa:#4a4a46;
  --mapa-agua:#0d141b; --mapa-terra:#2c2f33; --mapa-vizinho:#191b1e;
  --mapa-vizinho-linha:#212429; --mapa-costa:#4b5862; --mapa-rotulo:#66808f;
  --mapa-relevo:rgba(0,0,0,.45);
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  --r-fila-0:#2a2140; --r-fila-1:#3d2f5c; --r-fila-2:#55427e; --r-fila-3:#6f56a1;
  --r-fila-4:#8a6fc0; --r-fila-5:#a98cd8; --r-fila-6:#c6aeea;
  --r-oci-0:#122c17; --r-oci-1:#1c4522; --r-oci-2:#26602c; --r-oci-3:#327c37;
  --r-oci-4:#3f9c35; --r-oci-5:#5cba4d; --r-oci-6:#86d476;
  --r-azul-0:#12233d; --r-azul-1:#1a3a63; --r-azul-2:#23528d; --r-azul-3:#2d6bb8;
  --r-azul-4:#3f88d8; --r-azul-5:#6aa6e8; --r-azul-6:#9cc6f2;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-size:14px;
  font-family:'Raleway',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;}
h1,h2,h3{margin:0;font-weight:700;}
.disp{font-weight:800;letter-spacing:-.01em;}
.tab-num{font-variant-numeric:tabular-nums;}

/* ---- layout ---- */
.app{display:flex;min-height:100vh;}
.lateral{
  width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;gap:20px;position:sticky;top:0;height:100vh;
}
.principal{flex:1;min-width:0;}
.envelope{max-width:1320px;margin:0 auto;padding:24px 28px 72px;}
.marca{display:flex;align-items:center;gap:10px;padding:0 6px;}
.nav{display:flex;flex-direction:column;gap:3px;}
.nav button{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:0;
  background:transparent;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-soft);
  text-align:left;width:100%;
}
.nav button:hover{background:var(--surface-2);}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong);}
:root[data-tema="escuro"] .nav button[aria-current="page"]{color:var(--brand-strong);}
.rodape-lateral{
  margin-top:auto;padding:12px;border-radius:10px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--ink-soft);line-height:1.45;
}
.selo{
  font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);
}

/* ---- componentes ---- */
.cartao{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sombra);}
.cabecalho-pagina{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;}
.subtitulo{font-size:13px;color:var(--ink-soft);margin-top:3px;max-width:66ch;line-height:1.5;}
.rotulo{
  font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);
}
.linha-filtros{
  display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;
  padding:14px 18px;margin-bottom:16px;
}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0;}
select,.botao{
  font:inherit;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:8px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer;
}
select:focus-visible,.botao:focus-visible,.nav button:focus-visible,.pilula:focus-visible{
  outline:2px solid var(--brand);outline-offset:2px;
}
.botao:hover{background:var(--surface-2);}
.botao.primario{background:var(--brand);border-color:var(--brand);color:#fff;}
:root[data-tema="escuro"] .botao.primario{color:#0f1a26;}
.grupo-pilulas{display:flex;gap:6px;flex-wrap:wrap;}
.pilula{
  padding:7px 12px;border-radius:999em;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-soft);
}
.pilula[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
:root[data-tema="escuro"] .pilula[aria-pressed="true"]{color:#0f1a26;}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  display:flex;flex-direction:column;gap:4px;box-shadow:var(--sombra);}
.tile .valor{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.tile .nota{font-size:11px;color:var(--ink-faint);line-height:1.4;}
.tile .marcador{width:22px;height:3px;border-radius:2px;margin-bottom:2px;}

.grade{display:grid;gap:14px;}
.grade.principal-lateral{grid-template-columns:1.15fr .85fr;}
.grade.mapa-lateral{grid-template-columns:minmax(0,1fr) 300px;}
.grade.duas{grid-template-columns:repeat(2,minmax(0,1fr));}
.grade.tres{grid-template-columns:repeat(3,minmax(0,1fr));}
.painel{padding:18px 20px;min-width:0;}
.painel h3{font-size:14px;}
.painel .legenda-painel{font-size:11.5px;color:var(--ink-faint);margin-top:2px;line-height:1.45;}

/* ---- barras ---- */
.barras{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.barra{display:grid;grid-template-columns:var(--col1,190px) 1fr auto;align-items:center;gap:10px;}
.barra .nome{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.barra .trilho{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.barra .preenche{height:100%;border-radius:0 4px 4px 0;}
.barra .num{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:right;}
.barra:hover .nome{color:var(--ink);}

/* ---- tabelas ---- */
.tabela-envelope{overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;font-size:12px;}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
/* a primeira coluna carrega nome, não número: deixá-la quebrar é o que faz caber a
   última coluna num cartão estreito, em vez de sumir atrás do scroll horizontal. */
th:first-child,td:first-child{text-align:left;white-space:normal;}
/* tabela sem coluna de prosa não estica até a largura do cartão: quatro números
   espalhados por 1.200 px perdem a linha de leitura. As de prosa seguem em 100%. */
.tabela-envelope table:not(:has(.prosa)){width:fit-content;min-width:min(100%,640px);}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);
  position:sticky;top:0;background:var(--surface);}
tbody tr:hover{background:var(--surface-2);}
td.num{font-variant-numeric:tabular-nums;}
th.prosa,td.prosa{white-space:normal;text-align:left;min-width:22ch;line-height:1.45;}
.link-tabela{background:none;border:0;padding:0;font-size:11.5px;font-weight:600;color:var(--brand);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

/* ---- mapa ---- */
.mapa-caixa{background:var(--mapa-agua);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;position:relative;}
.mapa-caixa svg{display:block;width:100%;height:auto;}
.mapa-caixa circle[data-micro]{cursor:pointer;transition:stroke-width .12s ease-out;}
.mapa-caixa circle[data-micro]:hover{stroke:var(--ink);stroke-width:2;}
.mapa-caixa circle.selecionado{stroke:var(--ink);stroke-width:2.5;}
/* a sombra descola o município da água e do vizinho: sem ela, no zoom de uma CRE,
   Niterói e o Rio viram a mesma mancha clara */
.mapa-caixa .municipio{filter:drop-shadow(0 1px 2px var(--mapa-relevo));}
/* hidrografia em itálico, como em mapa impresso: orienta sem competir com as bolhas */
.mapa-caixa .agua{fill:var(--mapa-rotulo);font-size:13px;font-style:italic;letter-spacing:.08em;
  font-weight:600;pointer-events:none;}
.mapa-caixa .localizador{pointer-events:none;}
.mapa-caixa .localizador .moldura{fill:var(--mapa-agua);stroke:var(--border-strong);stroke-width:1;}
.mapa-caixa .localizador .quadro{fill:var(--brand);fill-opacity:.15;stroke:var(--brand);stroke-width:1.5;}
.legenda{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--ink-soft);
  padding:9px 12px;background:var(--surface);border-top:1px solid var(--border);}
.legenda .escala{display:flex;align-items:center;gap:4px;}
.legenda .degrau{width:22px;height:10px;border-radius:2px;}
.dica{
  position:fixed;pointer-events:none;z-index:60;max-width:290px;padding:10px 12px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border-strong);box-shadow:0 8px 26px rgba(0,0,0,.18);
  font-size:11.5px;line-height:1.5;opacity:0;transition:opacity .09s;
}
.dica.visivel{opacity:1;}
.dica dl{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin:6px 0 0;}
.dica dt{color:var(--ink-faint);}
.dica dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}

/* ---- casos ---- */
.casos{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start;}
.caso-item{
  width:100%;text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer;
  border:1.5px solid var(--border);background:var(--surface);display:block;
}
.caso-item[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);}
.etiqueta{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;display:inline-block;}
.trilha{display:flex;align-items:center;margin:18px 0 4px;}
.trilha .etapa{display:flex;align-items:center;flex:1;}
.trilha button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.trilha .ponto{width:13px;height:13px;border-radius:99px;}
.trilha .rotulo-etapa{font-size:9.5px;text-align:center;line-height:1.2;max-width:76px;}
.trilha .fio{height:2px;flex:1;margin:0 3px 16px;}
.abas{display:flex;gap:20px;border-bottom:1px solid var(--border);margin:16px 0;}
.abas button{background:none;border:0;border-bottom:2.5px solid transparent;padding:11px 2px;
  font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.abas button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 22px;}
.doc{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px;cursor:pointer;background:var(--surface);width:100%;text-align:left;}
.doc .caixa{width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;border:1.5px solid var(--border-strong);}
.evento{display:flex;gap:11px;padding-bottom:16px;}
.evento .traco{display:flex;flex-direction:column;align-items:center;}
.evento .bolinha{width:9px;height:9px;border-radius:99px;margin-top:4px;}
.evento .fio{width:1.5px;flex:1;background:var(--border);margin-top:4px;}

.aviso{border:1px solid var(--brand-soft);background:var(--brand-tint);border-radius:10px;padding:12px 14px;
  font-size:11.5px;color:var(--ink-soft);line-height:1.5;}
.carregando{padding:60px 0;text-align:center;color:var(--ink-faint);font-size:13px;}
.oculto{display:none;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

@media (max-width:1180px){
  .grade.principal-lateral,.grade.mapa-lateral,.grade.tres{grid-template-columns:minmax(0,1fr);}
}
@media (max-width:1000px){
  .app{flex-direction:column;}
  .lateral{width:auto;flex:none;height:auto;position:static;flex-direction:row;align-items:center;
    flex-wrap:wrap;gap:12px;border-right:0;border-bottom:1px solid var(--border);}
  .rodape-lateral{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;}
  .envelope{padding:18px 16px 60px;}
  .casos,.grade.duas{grid-template-columns:minmax(0,1fr);}
  .barra{grid-template-columns:minmax(0,1fr) auto;}
  .barra .trilho{grid-column:1/-1;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="app">
  <nav class="lateral" aria-label="Seções">
    <div class="marca">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3 2 9l10 6 10-6-10-6Z"></path><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"></path>
      </svg>
      <div>
        <div class="disp" style="font-size:14.5px;line-height:1.15;">Creche Conectada</div>
        <div style="font-size:10.5px;color:var(--ink-faint);">Painel da rede · SME/IPP 2025</div>
      </div>
    </div>

    <div class="nav" id="nav"></div>

    <div class="rodape-lateral">
      <div class="selo">Protótipo · Hackathon</div>
      <div>Todo número desta tela é somado no navegador a partir dos CSVs do estudo
      <em>Fila de creche do Rio</em> (SME/IPP, base 2025). A aba <strong>Banco</strong> lê o
      Postgres do bot; as demais não dependem dele.</div>
      <div id="origem-dados" style="color:var(--ink-faint);"></div>
      <button class="botao" id="btn-tema" style="margin-top:4px;font-size:11.5px;padding:6px 10px;">Tema escuro</button>
    </div>
  </nav>

  <main class="principal">
    <div class="envelope" id="conteudo">
      <div class="carregando">Lendo os CSVs…</div>
    </div>
  </main>
</div>

<div class="dica" id="dica" role="tooltip" aria-hidden="true"></div>

<!-- ---------------------------------------------------------------------------
  Último retrato do banco, gravado por `make painel-snapshot`. Fica embutido pelo
  mesmo motivo dos CSVs abaixo: o painel tem que abrir com duplo clique e numa
  hospedagem estática sem perder o sentido. Com `make painel` no ar, /api/banco.json
  responde ao vivo e este bloco é ignorado. São contagens: nenhum valor de coluna
  de pessoa passa por aqui.
  --------------------------------------------------------------------------- -->
<script type="application/json" id="snapshot-banco">
{
 "gerado_em": "2026-08-31T21:15:03+00:00",
 "origem": "snapshot",
 "schema": "creche",
 "sql": {
  "tabelas": "SELECT (SELECT count(*) FROM creche.contato) AS \"contato\",\n       (SELECT count(*) FROM creche.identidade_canal) AS \"identidade_canal\",\n       (SELECT count(*) FROM creche.consentimento) AS \"consentimento\",\n       (SELECT count(*) FROM creche.sessao) AS \"sessao\",\n       (SELECT count(*) FROM creche.inscricao) AS \"inscricao\",\n       (SELECT count(*) FROM creche.cadastro) AS \"cadastro\",\n       (SELECT count(*) FROM creche.resposta_criterio) AS \"resposta_criterio\",\n       (SELECT count(*) FROM creche.preferencia_escola) AS \"preferencia_escola\",\n       (SELECT count(*) FROM creche.evento_inscricao) AS \"evento_inscricao\",\n       (SELECT count(*) FROM creche.outbox) AS \"outbox\",\n       (SELECT count(*) FROM creche.marca) AS \"marca\"",
  "cadastro": "SELECT count(*) FILTER (WHERE protocolo IS NULL)     AS abertos,\n       count(*) FILTER (WHERE protocolo IS NOT NULL) AS enviados\n  FROM creche.cadastro",
  "preenchimento": "SELECT count(*) AS total,\n       count(documento_crianca) AS \"documento_crianca\",\n       count(nascimento_crianca) AS \"nascimento_crianca\",\n       count(grupamento) AS \"grupamento\",\n       count(origem) AS \"origem\",\n       count(nome_crianca) AS \"nome_crianca\",\n       count(nome_responsavel) AS \"nome_responsavel\",\n       count(cpf_responsavel) AS \"cpf_responsavel\",\n       count(telefone) AS \"telefone\",\n       count(email) AS \"email\",\n       count(cep) AS \"cep\",\n       count(numero) AS \"numero\",\n       count(logradouro) AS \"logradouro\",\n       count(bairro) AS \"bairro\",\n       count(lat) AS \"lat\",\n       count(lng) AS \"lng\",\n       count(horario) AS \"horario\"\n  FROM creche.cadastro",
  "sessoes": "SELECT estado, count(*) AS n\n  FROM creche.sessao GROUP BY estado ORDER BY n DESC, estado",
  "origens": "SELECT coalesce(origem, 'ainda não respondeu') AS origem,\n       count(*) AS n\n  FROM creche.cadastro GROUP BY origem ORDER BY n DESC, origem",
  "criterios": "SELECT codigo,\n       count(*)                          AS respostas,\n       count(*) FILTER (WHERE declarado)  AS declarados,\n       count(*) FILTER (WHERE comprovado) AS comprovados,\n       bool_or(sensivel)                 AS sensivel\n  FROM creche.resposta_criterio\n GROUP BY codigo ORDER BY declarados DESC, codigo",

  const cab = linhas[0].map(s => s.trim());
  return linhas.slice(1)
    .filter(l => l.length > 1 || (l[0] || "").trim() !== "")
    .map(l => { const o = {}; cab.forEach((k, i) => o[k] = (l[i] === undefined ? "" : l[i])); return o; });
}
const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
const i0 = v => Math.round(n(v));
const temNum = v => v !== "" && v !== null && v !== undefined && Number.isFinite(parseFloat(v));
/* Mesma normalização de `bairro_legivel` em creche_bot/backend/mapa.py: a base traz o
   separador em três grafias (`-`, `- `, ` / `) e o bot já mostra "Rio Comprido /
   Turano". Painel e conversa têm que soletrar o mesmo bairro. */

async function carregarFontes(){
  const chaves = Object.keys(FONTES);
  const viaRede = await Promise.all(chaves.map(async k => {
    try {
      const r = await fetch(FONTES[k], { cache: "no-store" });
      if (!r.ok) return null;
      const txt = await r.text();
      return txt.trim().length ? txt : null;
    } catch (_) { return null; }
  }));
  const bruto = {}; let redeOk = true;

    else {

  return { dados: Object.fromEntries(chaves.map(k => [k, lerCSV(bruto[k])])), redeOk };

/* --------------------------------------------------------------- agregação */
function construirModelo(d){
  /* microáreas: a tabela-mãe do mapa. `ociosas` aqui é a definição estrita, a
     mesma de microareas_metricas.vagas_ociosas, e não é a soma do `le` das
     unidades, que segue outra régua. As três contagens ficam expostas no
     painel "Sobre os números" em vez de escondidas atrás de um total só. */
  const dist = new Map(d.distancia.map(r => [r.micro, r]));
  const met  = new Map(d.metricas.map(r => [r.micro, r]));

  const porMicro = new Map();
  d.unidades.forEach(u => {
    if (!porMicro.has(u.micro)) porMicro.set(u.micro, []);
    porMicro.get(u.micro).push(u);
  });
  /* fallback de coordenada: microárea sem unidade no recorte do mapa ainda
     pode ter unidade no catálogo completo */
  const catPorMicro = new Map();
  d.catalogo.forEach(u => {
    if (!u.microarea || !temNum(u.lat)) return;
    if (!catPorMicro.has(u.microarea)) catPorMicro.set(u.microarea, []);
    catPorMicro.get(u.microarea).push(u);
  });

  const microareas = d.microareas.map(r => {
    const us = porMicro.get(r.cod) || [];
    const fonteCoord = us.length ? us : (catPorMicro.get(r.cod) || []);
    const lat = fonteCoord.length ? fonteCoord.reduce((a, u) => a + n(u.lat), 0) / fonteCoord.length : null;
    const lon = fonteCoord.length ? fonteCoord.reduce((a, u) => a + n(u.lon), 0) / fonteCoord.length : null;
    const dd = dist.get(r.cod), mm = met.get(r.cod);
    return {
      cod: r.cod, cre: r.cre, creNome: r.cre_nome, bairro: bairroLegivel(r.bairro),
      unidades: i0(r.unidades), demanda: i0(r.demanda), conf: i0(r.conf),
      espera: i0(r.espera), perdeu: i0(r.perdeu), ociosas: i0(r.ociosas),
      pressao: n(r.pressao),
      deficit: mm ? i0(mm.deficit) : null,
      metaParceiras: mm ? i0(mm.meta_parceiras) : null,
      nParceiras: mm ? i0(mm.n_parceiras) : null,
      kmMediana: dd && temNum(dd.km_mediana) ? n(dd.km_mediana) : null,
      esperaAncorada: dd ? i0(dd.espera_ancorada) : null,
      esperaComVaga3km: dd ? i0(dd.espera_com_vaga_ate3km) : null,
      lat, lon,
      unidadesMapa: us,
      leSoma: us.reduce((a, u) => a + i0(u.le), 0)
    };
  });
  const porCod = new Map(microareas.map(m => [m.cod, m]));

  /* CREs, agregadas a partir das microáreas, nunca digitadas */
  const cres = new Map();
  microareas.forEach(m => {
    if (!cres.has(m.cre)) cres.set(m.cre, {
      n: m.cre, nome: m.creNome, microareas: 0, unidades: 0, demanda: 0,
      conf: 0, espera: 0, perdeu: 0, ociosas: 0, leSoma: 0
    });
    const c = cres.get(m.cre);
    c.microareas++; c.unidades += m.unidades; c.demanda += m.demanda; c.conf += m.conf;
    c.espera += m.espera; c.perdeu += m.perdeu; c.ociosas += m.ociosas; c.leSoma += m.leSoma;
  });
  const listaCre = [...cres.values()].sort((a, b) => n(a.n) - n(b.n));

  /* catálogo completo de unidades por CRE, com o que o mapa sabe sobre elas */
  const unidPorDesig = new Map(d.unidades.map(u => [u.desig7, u]));
  const catalogoPorCre = new Map();
  d.catalogo.forEach(u => {
    if (!catalogoPorCre.has(u.cre)) catalogoPorCre.set(u.cre, []);
    const noMapa = unidPorDesig.get(u.desig7);
    catalogoPorCre.get(u.cre).push({
      desig7: u.desig7, nome: u.nome, tipo: u.tipo, bairro: bairroLegivel(u.bairro), rua: u.rua,
      micro: u.microarea || (noMapa ? noMapa.micro : ""),
      lat: temNum(u.lat) ? n(u.lat) : null, lon: temNum(u.lon) ? n(u.lon) : null,
      noMapa: u.no_mapa === "sim",
      demanda: temNum(u.demanda_1a) ? i0(u.demanda_1a) : null,
      conf: temNum(u.confirmados) ? i0(u.confirmados) : null,
      le: noMapa ? i0(noMapa.le) : (temNum(u.vagas_ociosas) ? i0(u.vagas_ociosas) : null)
    });
  });
  catalogoPorCre.forEach(v => v.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR")));

  /* Vagas ociosas por grupamento. A CRE vem da microárea quando a unidade está no
     recorte do mapa e, quando não está, do catálogo: duas unidades de Bangu
     (0008028 e 0008029, 114 vagas) só existem no catálogo, e sem esse segundo caminho
     elas entravam no total da cidade mas sumiam de todo recorte por CRE. */
  const microDaUnidade = new Map(d.unidades.map(u => [u.desig7, u.micro]));
  const creDoCatalogo = new Map(d.catalogo.map(u => [u.desig7, u.cre]));
  const ociosasGeo = d.ociosasGeo.map(r => {
    const micro = microDaUnidade.get(r.desig7) || "";
    const m = porCod.get(micro);
    return {
      desig7: r.desig7, grupamento: r.grupamento, vagas: i0(r.vagas),
      nome: r.DENOMINACAO, bairro: bairroLegivel(r.BAIRRO), sobra3km: i0(r.sobra_3km),
      lat: n(r.LATITUDE), lon: n(r.LONGITUDE), micro,
      cre: m ? m.cre : (creDoCatalogo.get(r.desig7) || "")
    };
  });

  /* A mesma lista que `_unidades()` monta em creche_bot/backend/mapa.py: as 820 do
     recorte, rua vinda do catálogo pelo desig7, vaga ociosa por GRUPAMENTO (e não
     somada), e o mesmo descarte de quem não tem coordenada, porque sem ela não há distância,
     e distância é o eixo da tela do bot. */
  const ociosasPorUnidade = new Map();
  d.ociosasGeo.forEach(r => {
    const v = i0(r.vagas);
    if (v <= 0) return;
    if (!ociosasPorUnidade.has(r.desig7)) ociosasPorUnidade.set(r.desig7, {});
    ociosasPorUnidade.get(r.desig7)[r.grupamento] = v;
  });
  const ruaPorDesig = new Map(d.catalogo.map(u => [u.desig7, u.rua]));
  const unidadesBot = d.unidades
    .filter(u => n(u.lat) && n(u.lon))
    .map(u => ({
      desig7: u.desig7, nome: u.nm, tipo: u.Tipo, micro: u.micro,
      bairro: bairroLegivel(u.bairro), rua: ruaPorDesig.get(u.desig7) || "",
      lat: n(u.lat), lon: n(u.lon), d1: i0(u.d1), cf: i0(u.cf),
      ociosas: ociosasPorUnidade.get(u.desig7) || {}
    }));

  return { microareas, porCod, listaCre, catalogoPorCre, ociosasGeo, unidadesBot };
}

/* ===========================================================================
   As contas do bot, reimplementadas sobre os mesmos CSVs
   ---------------------------------------------------------------------------
   Espelho fiel de creche_bot/backend/mapa.py. Se aquele arquivo mudar, este
   bloco mente, e é por isso que a vista "Cálculos" mostra o valor cru de cada
   passo em vez de só o resultado: a divergência fica visível.
   =========================================================================== */
const BOT = {
  ANO_BASE: 2025,
  RAIOS_KM: [2.0, 3.5, 5.0],   // 82,9% de quem trocou de creche andou até 2 km
  CHANCE_MIN: 0.03,            // nunca 0: fila cheia no ano passado não fecha a porta
  CHANCE_MAX: 0.95,            // nunca 1: vaga hoje não garante vaga em fevereiro
  CHANCE_COM_VAGA_OCIOSA: 0.80,
  VIZINHAS_DA_REGIAO: 7,       // uma vizinha só erra na divisa
  N_ESCOLAS: 3,                // limite de botões do WhatsApp, valendo já no Telegram
  // De `conversa/passos/escolas.py`: abaixo de 1,5 "N famílias por vaga" arredonda para 1
  // e vira ruído gramatical, então a linha some.
  DISPUTA_VISIVEL: 1.5
};
const GRUPAMENTOS = ["Berçário", "Maternal I", "Maternal II"];

/* Haversine, em quilômetros. Linha reta, não a pé, e o bot apresenta assim. */
function kmEntre(lat1, lon1, lat2, lon2){
  const rad = Math.PI / 180;
  const dlat = (lat2 - lat1) * rad, dlon = (lon2 - lon1) * rad;
  const a = Math.sin(dlat / 2) ** 2
          + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dlon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(a));
}

/* chance = confirmados ÷ demanda de 1ª opção, com piso, teto e o piso de vaga aberta.
   `null` sem denominador: 0% seria mentira sobre creche que ninguém disputou. */
function chanceEm(u, temVagaOciosa){
  if (u.d1 <= 0) return null;
  let bruta = u.cf / u.d1;
  if (temVagaOciosa) bruta = Math.max(bruta, BOT.CHANCE_COM_VAGA_OCIOSA);
  return Math.min(BOT.CHANCE_MAX, Math.max(BOT.CHANCE_MIN, bruta));
}

/* Famílias por vaga preenchida em 2025. `null` quando confirmados passa a demanda de
   1ª opção: a unidade recebeu quem pediu outra creche primeiro, e "menos de 1 família
   por vaga" não existe. */
function candidatosPorVaga(u){
  if (u.d1 <= 0 || u.cf <= 0 || u.cf > u.d1) return null;
  return u.d1 / u.cf;
}

/* Abre o raio só se o anterior não encher as N vagas da tela. */
function candidatasNoRaio(pt, unidades, alvo){
  const passos = BOT.RAIOS_KM.map(raio => {
    const dentro = unidades
      .map(u => ({ km: kmEntre(pt.lat, pt.lon, u.lat, u.lon), u }))
      .filter(x => x.km <= raio);
    return { raio, dentro };
  });
  const usado = passos.find(x => x.dentro.length >= alvo) || passos[passos.length - 1];
  return { passos, usado, perto: usado.dentro.slice().sort((a, b) => a.km - b.km) };
}

/* A microárea sai da MAIORIA entre as vizinhas mais próximas, não de ponto-em-polígono:
   o shapefile do IPP não viaja com o bot, e a vizinha única arrasta a família para o
   outro lado da divisa. */
function panoramaDaRegiao(pt, unidades){
  const vizinhas = unidades
    .map(u => ({ km: kmEntre(pt.lat, pt.lon, u.lat, u.lon), u }))
    .sort((a, b) => a.km - b.km).slice(0, BOT.VIZINHAS_DA_REGIAO);
  const votos = new Map();
  vizinhas.forEach(v => { if (v.u.micro) votos.set(v.u.micro, (votos.get(v.u.micro) || 0) + 1); });
  if (!votos.size) return null;
  const ordenado = [...votos.entries()].sort((a, b) => b[1] - a[1]);
  const micro = M.porCod.get(ordenado[0][0]) || null;
  return { vizinhas, votos: ordenado, micro,
           bairro: (micro && micro.bairro) || vizinhas[0].u.bairro };
}

  getComputedStyle(document.documentElement).getPropertyValue(`--r-${nome}-${i}`).trim());

/* Quebras por quantil sobre os valores > 0. O zero fica sempre no neutro:
   "nenhuma vaga ociosa" não é o degrau mais claro de uma rampa, é outra coisa. */
function quebrasQuantil(valores, nFaixas){
  const v = valores.filter(x => x > 0).sort((a, b) => a - b);
  if (!v.length) return [];
  const q = [];
  for (let k = 1; k < nFaixas; k++){
    const p = (k / nFaixas) * (v.length - 1);
    const lo = Math.floor(p), hi = Math.ceil(p);
    q.push(v[lo] + (v[hi] - v[lo]) * (p - lo));
  }
  return q;
}
function faixaDe(valor, quebras){
  let k = 0; while (k < quebras.length && valor > quebras[k]) k++;
  return k;
}

function barras(itens, opcoes){
  const o = Object.assign({ cor: "var(--brand)", col1: "190px", formata: fmt.format }, opcoes || {});

  return `<div class="barras" style="--col1:${o.col1}">` + itens.map(x => `
    <div class="barra">
      <div class="nome" title="${esc(x.titulo || x.nome)}">${esc(x.nome)}</div>
      <div class="trilho"><div class="preenche" style="width:${x.valor > 0 ? Math.max(1.5, 100 * x.valor / max) : 0}%;background:${x.cor || o.cor};"></div></div>
      <div class="num">${o.formata(x.valor)}</div>
    </div>`).join("") + `</div>`;
}

/* `prosa` lista os índices de coluna que carregam frase em vez de número: sem isso o
   `white-space:nowrap` global (que existe para o número não quebrar) estoura a largura da
   tabela e a última coluna some para fora da tela. */
function tabela(colunas, linhas, prosa){
  const p = new Set(prosa || []);
  return `<div class="tabela-envelope"><table>
    <thead><tr>${colunas.map((c, i) => `<th scope="col"${p.has(i) ? ' class="prosa"' : ""}>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${linhas.map(l => `<tr>${l.map((c, i) =>
      `<td class="${p.has(i) ? "prosa" : (i ? "num" : "")}">${c === null || c === undefined || c === "" ? "—" : esc(c)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>`;
}

/* Ancora cada caso numa unidade real: dentro da CRE do roteiro, escolhe as
   microáreas de maior fila e, dentro delas, unidades distintas. Determinístico,
   o mesmo CSV produz sempre a mesma lista. */
let CASOS = [];
function ancorarCasos(){
  const usadas = new Set();
  CASOS = ROTEIRO_CASOS.map(base => {
    const micros = M.microareas
      .filter(m => m.cre === base.cre && m.unidadesMapa.length)
      .sort((a, b) => b.espera - a.espera || a.cod.localeCompare(b.cod));
    let escolhida = null, micro = null;
    for (const m of micros){
      const cand = m.unidadesMapa.slice().sort((a, b) => i0(b.d1) - i0(a.d1) || a.nm.localeCompare(b.nm));
      const u = cand.find(x => !usadas.has(x.desig7));
      if (u){ escolhida = u; micro = m; break; }
    }
    if (escolhida) usadas.add(escolhida.desig7);
    return Object.assign({}, base, {
      unidade: escolhida ? escolhida.nm : "A definir",
      tipoUnidade: escolhida ? escolhida.Tipo : "",
      bairro: escolhida ? escolhida.bairro : (micro ? micro.bairro : "—"),
      micro: micro ? micro.cod : "",
      unidadeDados: escolhida || null
    });
  });
}
const acharCaso = id => CASOS.find(c => c.id === id) || CASOS[0];
const statusDe = c => estado.statusManual[c.id] || c.status;

/* =========================================================================== */
/*  Recortes                                                                   */
/* =========================================================================== */
function microareasVisiveis(){
  return estado.cre ? M.microareas.filter(m => m.cre === estado.cre) : M.microareas;
}
function totaliza(lista){
  const t = { microareas: lista.length, unidades:0, demanda:0, conf:0, espera:0,
              perdeu:0, ociosas:0, leSoma:0, esperaAncorada:0, comVaga3km:0 };
  lista.forEach(m => {
    t.unidades += m.unidades; t.demanda += m.demanda; t.conf += m.conf; t.espera += m.espera;
    t.perdeu += m.perdeu; t.ociosas += m.ociosas; t.leSoma += m.leSoma;
    t.esperaAncorada += m.esperaAncorada || 0; t.comVaga3km += m.esperaComVaga3km || 0;
  });
  return t;
}
/* 6 microáreas da base não têm bairro nem unidade (6.11, 7.20, 7.21, 8.3, 8.5, 9.3):
   são linhas zeradas. Sem isto a tabela mostra "9.3 · " com um ponto solto no fim. */
const nomeMicro = m => `${m.cod} · ${m.bairro || "sem bairro na base"}`;

const rotuloRecorte = () => {
  if (!estado.cre) return "Cidade do Rio de Janeiro";
  const c = M.listaCre.find(x => x.n === estado.cre);
  return c ? `${c.n}ª CRE — ${c.nome}` : "—";
};

/* =========================================================================== */
/*  Vista: Mapa territorial                                                    */
/* =========================================================================== */
const METRICAS = {
  espera:      { nome:"Fila",            rampa:"fila", campo:m => m.espera,  unidade:"crianças na fila" },
  ociosas:     { nome:"Vagas ociosas",   rampa:"oci",  campo:m => m.ociosas, unidade:"vagas ociosas" },
  demanda:     { nome:"Demanda",         rampa:"azul", campo:m => m.demanda, unidade:"inscrições de 1ª opção" },
  descompasso: { nome:"Descompasso",     rampa:null,   campo:m => m.ociosas - m.espera, unidade:"vagas ociosas menos fila" }
};

function vistaMapa(){
  const lista = microareasVisiveis().filter(m => m.lat !== null && m.lon !== null);
  const t = totaliza(microareasVisiveis());
  const desc = microareasVisiveis().filter(m => m.espera > 0 && m.ociosas > 0).length;

  const sobra = microareasVisiveis()
    .filter(m => m.ociosas > 0 && m.ociosas > m.espera)
    .sort((a, b) => (b.ociosas - b.espera) - (a.ociosas - a.espera)).slice(0, 8);
  const aperto = microareasVisiveis()
    .filter(m => m.ociosas === 0 && m.espera > 0)
    .sort((a, b) => b.espera - a.espera).slice(0, 8);

  const grup = new Map();
  M.ociosasGeo.filter(r => !estado.cre || r.cre === estado.cre)
    .forEach(r => grup.set(r.grupamento, (grup.get(r.grupamento) || 0) + r.vagas));
  const ordemGrup = ["Berçário", "Maternal I", "Maternal II"];
  const rOci = rampa("oci");
  const barrasGrup = ordemGrup.filter(g => grup.has(g))
    .map((g, k) => ({ nome:g, valor:grup.get(g), cor:rOci[2 + k * 2] }));

  /* distância: histograma das medianas por microárea */
  const faixas = [
    { nome:"até 1 km",   teste:k => k <= 1 },
    { nome:"1 a 3 km",   teste:k => k > 1 && k <= 3 },
    { nome:"3 a 5 km",   teste:k => k > 3 && k <= 5 },

/* --------------------------------------------------------- desenho do mapa */
/* A silhueta vem do bloco <script id="contorno-municipio">: malha do IBGE, anéis
   [lon,lat,...]. Sem ela as bolhas flutuavam num retângulo vazio e ninguém
   reconhecia a cidade. Nenhum número do painel sai daqui: é só o desenho. */
const TERRA = (() => {
  const bloco = document.getElementById("contorno-municipio");
  try { return JSON.parse(bloco.textContent); } catch (_) { return { rio: [], viz: [] }; }
})();

/* Caixa do município, calculada uma vez: é o enquadramento da cidade inteira. */
const CAIXA_RIO = (() => {
  const c = { lonMin: 180, lonMax: -180, latMin: 90, latMax: -90 };
  TERRA.rio.forEach(a => { for (let i = 0; i < a.length; i += 2){
    c.lonMin = Math.min(c.lonMin, a[i]);     c.lonMax = Math.max(c.lonMax, a[i]);
    c.latMin = Math.min(c.latMin, a[i + 1]); c.latMax = Math.max(c.latMax, a[i + 1]);
  }});
  if (c.lonMax <= c.lonMin) return null;
  /* 4% de folga: sem isso a cidade encosta nas quatro bordas e o mar some do quadro. */
  const fx = (c.lonMax - c.lonMin) * 0.04, fy = (c.latMax - c.latMin) * 0.04;
  return { lonMin: c.lonMin - fx, lonMax: c.lonMax + fx,
           latMin: c.latMin - fy, latMax: c.latMax + fy };
})();

/* A baía e o mar são o que orienta o olho num mapa do Rio. Ancorados em lon/lat:
   quem sai do quadro no zoom de uma CRE some sozinho. */
const AGUAS = [
  { nome: "Baía de Guanabara", lon: -43.170, lat: -22.830 },
  { nome: "Oceano Atlântico",  lon: -43.330, lat: -23.035 }
];

function desenharMapa(lista){
  if (!lista.length) return `<p class="legenda-painel" style="padding:20px;">Sem microáreas com coordenada neste recorte.</p>`;

  /* Enquadramento: a cidade inteira mostra o município inteiro; um recorte de CRE
     aproxima nas bolhas daquela CRE, e a silhueta continua por baixo, cortada. */
  let base = CAIXA_RIO;
  if (estado.cre || !base){
    const lats = lista.map(m => m.lat), lons = lista.map(m => m.lon);
    const folgaLon = Math.max(0.012, (Math.max(...lons) - Math.min(...lons)) * 0.09);
    const folgaLat = Math.max(0.012, (Math.max(...lats) - Math.min(...lats)) * 0.09);
    base = { lonMin: Math.min(...lons) - folgaLon, lonMax: Math.max(...lons) + folgaLon,
             latMin: Math.min(...lats) - folgaLat, latMax: Math.max(...lats) + folgaLat };
  }

  /* Equiretangular com escala única nos dois eixos: a altura sai do aspecto real do
     recorte, presa entre 340 e 560 para o painel não virar uma tira. O que sobra da
     folga fica com a silhueta, que é justamente o contexto que se quer ver. */
  const W = 1000, MARGEM = 12;
  const k = Math.cos((base.latMin + base.latMax) / 2 * Math.PI / 180);
  const larguraGeo = Math.max(1e-6, (base.lonMax - base.lonMin) * k);
  const alturaGeo  = Math.max(1e-6, base.latMax - base.latMin);
  const util = W - 2 * MARGEM;
  const H = Math.round(Math.min(560, Math.max(340, util * alturaGeo / larguraGeo)) + 2 * MARGEM);
  const escala = Math.min(util / larguraGeo, (H - 2 * MARGEM) / alturaGeo);
  const cLon = (base.lonMin + base.lonMax) / 2 * k, cLat = (base.latMin + base.latMax) / 2;
  const px = lon => W / 2 + (lon * k - cLon) * escala;
  const py = lat => H / 2 - (lat - cLat) * escala;
  const trilha = (a, fx, fy) => {
    let d = "";
    for (let i = 0; i < a.length; i += 2) d += (i ? "L" : "M") + fx(a[i]).toFixed(1) + "," + fy(a[i + 1]).toFixed(1);
    return d + "Z";
  };
  const caminho = a => trilha(a, px, py);

  const met = METRICAS[estado.metrica];
  const vals = lista.map(met.campo);
  const diverge = estado.metrica === "descompasso";
  const rFila = rampa("fila"), rOci = rampa("oci"), rMet = diverge ? null : rampa(met.rampa);
  const quebras = diverge ? null : quebrasQuantil(vals, 6);
  const maxAbs = Math.max(1, ...vals.map(Math.abs));

  const corDe = m => {
    const v = met.campo(m);
    if (diverge){
      if (v === 0) return "var(--neutro-mapa)";
      const passo = Math.min(3, Math.ceil(3 * Math.abs(v) / maxAbs));
      return v > 0 ? rOci[2 + passo] : rFila[2 + passo];
    }
    if (v <= 0) return "var(--neutro-mapa)";
    return rMet[1 + faixaDe(v, quebras)];
  };
  const raioDe = m => {
    const v = Math.abs(met.campo(m));
    return 3 + 19 * Math.sqrt(v / maxAbs);
  };

  const silhueta = `
    <rect x="0" y="0" width="${W}" height="${H}" fill="var(--mapa-agua)"></rect>
    <g fill="var(--mapa-vizinho)" stroke="var(--mapa-vizinho-linha)" stroke-width="1" stroke-linejoin="round">
      ${TERRA.viz.map(a => `<path d="${caminho(a)}"></path>`).join("")}
    </g>
    <g class="municipio" fill="var(--mapa-terra)" stroke="var(--mapa-costa)" stroke-width="1.1" stroke-linejoin="round">
      ${TERRA.rio.map(a => `<path d="${caminho(a)}"></path>`).join("")}
    </g>`;

  const rotulosAgua = AGUAS.map(a => {
    const x = px(a.lon), y = py(a.lat);
    if (x < 80 || x > W - 80 || y < 20 || y > H - 14) return "";
    return `<text class="agua" x="${x.toFixed(0)}" y="${y.toFixed(0)}" text-anchor="middle">${esc(a.nome)}</text>`;
  }).join("");

  /* No zoom de uma CRE, as microáreas vizinhas ficam como pontos neutros: mostram que
     o território continua depois da borda do recorte, sem entrar na escala de cor. */
  const fora = estado.cre ? M.microareas
    .filter(m => m.cre !== estado.cre && m.lat !== null)
    .map(m => [px(m.lon), py(m.lat)])
    .filter(([x, y]) => x > -10 && x < W + 10 && y > -10 && y < H + 10)
    .map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2"
      fill="var(--neutro-mapa)" fill-opacity=".6"></circle>`).join("") : "";

  const bolhas = lista.slice().sort((a, b) => raioDe(b) - raioDe(a)).map(m => {
    const r = raioDe(m);
    return `<circle data-micro="${esc(m.cod)}" cx="${px(m.lon).toFixed(1)}" cy="${py(m.lat).toFixed(1)}"
      r="${r.toFixed(1)}" fill="${corDe(m)}" fill-opacity=".82" stroke="var(--mapa-terra)" stroke-width="1.2"
      class="${estado.microSel === m.cod ? "selecionado" : ""}"><title>Microárea ${esc(m.cod)}, ${esc(m.bairro)}</title></circle>`;
  }).join("");

  const pontos = estado.mostrarUnidades ? lista.flatMap(m => m.unidadesMapa
    .filter(u => temNum(u.lat))
    .map(u => `<circle data-unidade="${esc(u.desig7)}" cx="${px(n(u.lon)).toFixed(1)}" cy="${py(n(u.lat)).toFixed(1)}"
      r="1.8" fill="var(--ink)" fill-opacity=".45"></circle>`)).join("") : "";

  /* legenda: degraus da rampa + escala de tamanho, sempre presentes */
  let legendaCor;
  if (diverge){
    legendaCor = `<div class="escala"><span>mais fila</span>
      ${[3,2,1].map(i => `<span class="degrau" style="background:${rFila[2+i]}"></span>`).join("")}
      <span class="degrau" style="background:var(--neutro-mapa)"></span>
      ${[1,2,3].map(i => `<span class="degrau" style="background:${rOci[2+i]}"></span>`).join("")}
      <span>mais vaga ociosa</span></div>`;
  } else {
    legendaCor = `<div class="escala">
      <span class="degrau" style="background:var(--neutro-mapa)"></span><span>zero</span>
      <span style="margin-left:10px;">1</span>
      ${[1,2,3,4,5,6].map(i => `<span class="degrau" style="background:${rMet[i]}"></span>`).join("")}
      <span>${fmt.format(Math.max(...vals))} ${esc(met.unidade)}</span></div>`;
  }

  /* Mapa de localização: no recorte de uma CRE o quadro corta a cidade, e sem esta
     miniatura ninguém sabe que pedaço do Rio está vendo. O retângulo é o próprio
     enquadramento, obtido projetando os cantos do quadro de volta para lon/lat. */
  let localizador = "";
  if (estado.cre && CAIXA_RIO){
    const largRio = (CAIXA_RIO.lonMax - CAIXA_RIO.lonMin) * k, altRio = CAIXA_RIO.latMax - CAIXA_RIO.latMin;
    const iw = 176, ih = Math.round(iw * altRio / largRio), pad = 7;
    const ix = W - iw - 2 * pad - 14, iy = H - ih - 2 * pad - 14;
    const e = iw / largRio;
    const qx = lon => ix + pad + (lon - CAIXA_RIO.lonMin) * k * e;
    const qy = lat => iy + pad + (CAIXA_RIO.latMax - lat) * e;
    const canto = (x, y) => [(cLon + (x - W / 2) / escala) / k, cLat + (H / 2 - y) / escala];
    const [lonA, latA] = canto(0, 0), [lonB, latB] = canto(W, H);
    const rx = Math.max(qx(lonA), ix + pad), ry = Math.max(qy(latA), iy + pad);
    const rw = Math.min(qx(lonB), ix + pad + iw) - rx, rh = Math.min(qy(latB), iy + pad + ih) - ry;
    localizador = `<g class="localizador" aria-hidden="true">
      <rect class="moldura" x="${ix}" y="${iy}" width="${iw + 2 * pad}" height="${ih + 2 * pad}" rx="9"></rect>
      <g fill="var(--mapa-terra)" stroke="var(--mapa-costa)" stroke-width=".7" stroke-linejoin="round">
        ${TERRA.rio.map(a => `<path d="${trilha(a, qx, qy)}"></path>`).join("")}
      </g>
      <rect class="quadro" x="${rx.toFixed(1)}" y="${ry.toFixed(1)}"
        width="${Math.max(5, rw).toFixed(1)}" height="${Math.max(5, rh).toFixed(1)}" rx="2"></rect>
    </g>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Mapa do município do Rio de Janeiro: uma bolha por microárea mostrando ${esc(met.nome)}. Os mesmos valores estão nas tabelas ao lado.">
      ${silhueta}
      <g>${rotulosAgua}</g>
      <g>${fora}</g><g>${pontos}</g><g id="camada-micro">${bolhas}</g>
      ${localizador}
    </svg>
    <div class="legenda">
      ${legendaCor}
      <div class="escala"><span>tamanho ∝ √${esc(met.nome.toLowerCase())}</span>
        <svg width="60" height="26" aria-hidden="true">
          <circle cx="9" cy="18" r="4" fill="none" stroke="var(--ink-faint)"></circle>
          <circle cx="26" cy="15" r="8" fill="none" stroke="var(--ink-faint)"></circle>
          <circle cx="48" cy="13" r="12" fill="none" stroke="var(--ink-faint)"></circle>
        </svg>
      </div>
    </div>`;
}

  const s = statusDe(c);
  const excecao = s === "cras" || s === "perdida";
  const refIdx = ETAPAS.indexOf(excecao ? c.ultimaEtapa : s);
  const micro = c.micro ? M.porCod.get(c.micro) : null;

  return `

    </div>
  </div>

  <div class="grupo-pilulas" style="margin-bottom:16px;">
    ${chaves.map(k => `<button class="pilula" data-etapa="${k}" aria-pressed="${estado.filtroEtapa === k}">

  <div class="casos">
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${filtrados.length ? filtrados.map(x => {
        const st = statusDe(x), cor = ETAPA_COR[st];
        return `<button class="caso-item" data-caso="${esc(x.id)}" aria-pressed="${x.id === c.id}">
          <strong style="font-size:12.5px;">${esc(x.nome)}</strong>
          <div style="font-size:11px;color:var(--ink-faint);margin-top:2px;">${esc(x.bairro)} · ${esc(x.unidade)}</div>
          <span class="etiqueta" style="background:${cor.bg};color:${cor.fg};margin-top:7px;">${esc(ETAPA_NOME[st])}</span>
        </button>`;
      }).join("") : `<p class="legenda-painel">Nenhum caso nesta etapa.</p>`}
    </div>

    <section class="cartao painel">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">
        <div>
          <h2 class="disp" style="font-size:18px;">${esc(c.nome)}</h2>
          <div style="font-size:12px;color:var(--ink-faint);margin-top:2px;">
            CPF ${esc(c.cpf)} · nascido em ${esc(c.nascimento)}</div>
        </div>
        <span class="etiqueta" style="background:${ETAPA_COR[s].bg};color:${ETAPA_COR[s].fg};font-size:11px;padding:5px 11px;">
          ${esc(ETAPA_NOME[s])}</span>
      </div>

      <div class="trilha">
        ${ETAPAS.map((k, i) => {

/* Um cartão por creche: a conta inteira aberta, do CSV até o percentual da tela. */
function cartaoConta(x, grup){
  const u = x.u;
  const vagasNoGrup = u.ociosas[grup] || 0;
  const temVaga = vagasNoGrup > 0;
  const bruta = u.d1 > 0 ? u.cf / u.d1 : null;
  const comPiso = bruta === null ? null : (temVaga ? Math.max(bruta, BOT.CHANCE_COM_VAGA_OCIOSA) : bruta);
  const final = chanceEm(u, temVaga);
  const conc = candidatosPorVaga(u);
  const travou = final !== null && comPiso !== null
    && (comPiso > BOT.CHANCE_MAX || comPiso < BOT.CHANCE_MIN);

  const passosChance = bruta === null
    ? [["sem demanda de 1ª opção em " + BOT.ANO_BASE, "a conta não roda, e o bot não mostra percentual"]]
    : [
        [`crua = confirmados ÷ demanda = ${fmt.format(u.cf)} ÷ ${fmt.format(u.d1)}`,
         fmt1.format(bruta * 100) + "%"],
        temVaga
          ? [`piso de vaga aberta: máx(crua; ${Math.round(BOT.CHANCE_COM_VAGA_OCIOSA * 100)}%), ${fmt.format(vagasNoGrup)} vaga(s) em ${grup} agora`,
             fmt1.format(comPiso * 100) + "%"]
          : [`sem vaga aberta em ${grup} hoje: o piso de ${Math.round(BOT.CHANCE_COM_VAGA_OCIOSA * 100)}% não se aplica`, "—"],
        [`limites: entre ${Math.round(BOT.CHANCE_MIN * 100)}% e ${Math.round(BOT.CHANCE_MAX * 100)}%`,
         (travou ? "travou → " : "não travou → ") + Math.round(final * 100) + "%"]
      ];

  return `<div style="border:1px solid var(--border);border-radius:11px;padding:14px 16px;">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;">
      <div style="min-width:0;">
        <strong style="font-size:13.5px;">${esc(u.nome)}</strong>
        <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px;">
          ${esc(u.tipo)} · ${esc(u.bairro)}${u.rua ? " · " + esc(u.rua) : ""} · desig7 ${esc(u.desig7)}</div>
      </div>
      <div style="display:flex;gap:16px;flex-shrink:0;">
        <div style="text-align:right;"><div class="rotulo">Distância</div>
          <div class="disp tab-num" style="font-size:17px;">${fmt2.format(x.km)} km</div></div>
        <div style="text-align:right;"><div class="rotulo">Chance estimada ${BOT.ANO_BASE}</div>
          <div class="disp tab-num" style="font-size:17px;color:${final === null ? "var(--ink-faint)" : "var(--brand)"};">
            ${final === null ? "não estimada" : Math.round(final * 100) + "%"}</div></div>
      </div>
    </div>
    <div class="grade duas" style="margin-top:12px;">
      <div>
        ${tabela(["Passo da chance", "Resultado"], passosChance)}
      </div>
      <div>
        ${tabela(["O que sai do CSV", "Valor"], [
          ["Demanda de 1ª opção (mapa_unidades.d1)", fmt.format(u.d1)],
          ["Confirmados (mapa_unidades.cf)", fmt.format(u.cf)],
          [`Vaga ociosa em ${grup} (vagas_ociosas_geo)`, temVaga ? fmt.format(vagasNoGrup) : "nenhuma"],
          ["Famílias por vaga = demanda ÷ confirmados",
           conc === null
             ? (u.cf > u.d1
                 ? `não sai: confirmados (${fmt.format(u.cf)}) passa a demanda de 1ª opção`
                 : "não sai: sem demanda ou sem confirmado")
             : `${fmt1.format(conc)} por vaga, em ${BOT.ANO_BASE}`],
          ["Distância = haversine(partida, unidade)", fmt2.format(x.km) + " km, em linha reta"]
        ], [1])}
      </div>
    </div>
    ${linhaDoBot(u, x.km, final, conc, temVaga)}
  </div>`;
}

/* A linha exata que `conversa/passos/escolas.py::_linha` monta, inclusive a regra que
   ENGOLE a chance quando não há concorrência, porque é de `concorrencia[1]` que o ano
   sai. Reproduzir a regra em vez do ideal é o que faz o painel servir de conferência:
   onde bot e conta discordam, a discordância aparece aqui. */
/* `escolas_proximas` arredonda a distância para 2 casas ANTES de qualquer tela, e
   `distancia()` troca de unidade abaixo de 1 km. Sem reproduzir os dois, o painel diverge
   do bot em metro e em casa decimal: 1,2536 km vira "1,3 km" aqui e "1,2 km" lá. */
function distanciaComoNoBot(kmCru){
  const km = Math.round(kmCru * 100) / 100;
  if (km < 1){
    const minutos = Math.max(1, Math.round(km / 5 * 60));
    return `${Math.round(km * 1000)} m (uns ${minutos} min a pé)`;
  }
  // `f"{km:.1f}"` do Python empata para o PAR: 1,25 km vira "1,2", e o `toFixed` do JS
  // viraria "1,3". Um décimo de quilômetro de diferença entre o painel e o bot sobre a
  // mesma creche é exatamente o tipo de divergência que esta tela existe para não ter.
  const d = km * 10, chao = Math.floor(d);
  const meio = Math.abs(d - chao - 0.5) < 1e-9;
  const arred = meio ? (chao % 2 === 0 ? chao : chao + 1) : Math.round(d);
  return (arred / 10).toFixed(1).replace(".", ",") + " km";
}

function linhaDoBot(u, km, chance, conc, temVaga){
  const mostraChance = chance !== null && conc !== null;
  const detalhe = [];
  if (mostraChance) detalhe.push(`chance estimada ${Math.round(chance * 100)}% (base ${BOT.ANO_BASE})`);
  else if (conc !== null && conc >= BOT.DISPUTA_VISIVEL)
    detalhe.push(`em ${BOT.ANO_BASE}, ${fmt.format(Math.round(conc))} famílias por vaga`);
  if (temVaga) detalhe.push("🟢 tem vaga aberta agora");
  const engolida = chance !== null && conc === null;

  return `<div style="margin-top:10px;padding:11px 13px;border-radius:10px;
      background:var(--surface-2);border-left:3px solid ${engolida ? "var(--alerta)" : "var(--brand)"};">
    <div class="rotulo">O que a família lê no bloco 6</div>
    <pre style="margin:6px 0 0;font:inherit;font-size:12.5px;white-space:pre-wrap;line-height:1.5;">${
      esc(`${u.nome}\n   ${distanciaComoNoBot(km)} · ${u.bairro}`)}${
      detalhe.length ? esc("\n   " + detalhe.join(" · ")) : ""}</pre>
    ${engolida ? `<div style="font-size:11.5px;color:var(--alerta);margin-top:8px;line-height:1.45;">
      <strong>A chance de ${Math.round(chance * 100)}% foi calculada e não é exibida.</strong>
      <code>_chance()</code> só imprime o número quando há concorrência, porque é de
      <code>concorrencia[1]</code> que ele tira o ano, e <code>candidatos_por_vaga()</code>
      devolve <code>None</code> aqui, já que confirmados (${fmt.format(u.cf)}) passa a demanda
      de 1ª opção (${fmt.format(u.d1)}). Acontece em 214 das 820 creches.</div>` : ""}
  </div>`;
}

/* A régua do estimador sobre as 820 unidades: onde a conta trava e por quê. */
function reguaDoEstimador(){
  const us = M.unidadesBot;
  const semDenominador = us.filter(u => u.d1 <= 0).length;
  const acima = us.filter(u => u.d1 > 0 && u.cf > u.d1);
  const noTeto = us.filter(u => { const c = chanceEm(u, false); return c !== null && c >= BOT.CHANCE_MAX; }).length;
  const noPiso = us.filter(u => { const c = chanceEm(u, false); return c !== null && c <= BOT.CHANCE_MIN; }).length;
  const semConc = us.filter(u => candidatosPorVaga(u) === null).length;
  const pior = acima.slice().sort((a, b) => (b.cf / b.d1) - (a.cf / a.d1))[0];

  const faixas = [[0, .2], [.2, .4], [.4, .6], [.6, .8], [.8, 1.01]];
  const rAzul = rampa("azul");
  const hist = faixas.map((f, k) => ({
    nome: `${Math.round(f[0] * 100)}% a ${Math.round(Math.min(1, f[1]) * 100)}%`,
    cor: rAzul[2 + k],
    valor: us.filter(u => { const c = chanceEm(u, false); return c !== null && c >= f[0] && c < f[1]; }).length
  }));

  return `<section class="cartao painel">
    <h3>A régua do estimador: onde a conta trava, nas ${fmt.format(us.length)} creches</h3>
    <p class="legenda-painel">O piso e o teto não são enfeite. <code>confirmados</code> conta
    <strong>toda</strong> matrícula efetivada na unidade, e não só quem a pediu em 1ª opção:
    quem escolheu outra creche e foi realocado para cá entra no numerador sem entrar no
    denominador. Em ${fmt.format(acima.length)} das ${fmt.format(us.length)} unidades
    (${pct(acima.length, us.length)}) a razão crua passa de 100%${
      pior ? `, e a maior chega a ${Math.round(100 * pior.cf / pior.d1)}% (${esc(pior.nome)}: ${fmt.format(pior.cf)} confirmados para ${fmt.format(pior.d1)} de demanda)` : ""}.
    O teto é o que impede isso de virar promessa na tela.</p>
    <div class="tiles" style="margin-top:12px;">
      ${tile("Travam no teto de 95%", fmt.format(noTeto), pct(noTeto, us.length) + " das creches", "var(--brand)")}
      ${tile("Travam no piso de 3%", fmt.format(noPiso), pct(noPiso, us.length) + " das creches", "var(--fila)")}
      ${tile("Razão crua acima de 100%", fmt.format(acima.length), "confirmados > demanda de 1ª opção", "var(--alerta)")}
      ${tile("Sem estimativa possível", fmt.format(semDenominador), "demanda de 1ª opção igual a zero")}
      ${tile("Sem famílias por vaga", fmt.format(semConc), "o bot omite o campo em vez de inventar")}
    </div>
    <div class="grade duas" style="margin-top:16px;">
      <div>
        <h3 style="font-size:13px;">Distribuição da chance estimada (sem vaga ociosa)</h3>
        ${comTabela("histchance", barras(hist, { col1:"110px" }),
          ["Faixa de chance", "Creches"], hist.map(h => [h.nome, fmt.format(h.valor)]))}
      </div>
      <div class="aviso">
        <strong>Por que não existe “sua chance”.</strong> O número é da creche, não da
        criança: sai de <code>confirmados ÷ demanda de 1ª opção</code> naquela unidade em
        ${BOT.ANO_BASE} e é idêntico para toda família que a olhar. A classificação, que é
        o que de fato decide, usa a régua de prioridade, roda depois do fechamento e não
        entra nesta conta. Por isso o rótulo é sempre <em>chance estimada</em>, sempre com o
        ano colado, e nunca “você vai conseguir”.
      </div>
    </div>
  </section>`;
}

async function carregarBanco(){
  try {
    const r = await fetch("api/banco.json", { cache:"no-store" });
    const j = await r.json();
    if (r.ok && j.origem === "postgres") return j;
  } catch (_) { /* sem servidor: cai no bloco embutido */ }
  try {
    const el = document.getElementById("snapshot-banco");
    const j = JSON.parse(el ? el.textContent : "{}");
    return j && j.tabelas ? j : { origem:"vazio" };
  } catch (_) { return { origem:"vazio" }; }
}

/* delegação: um só ouvinte para toda a página */
document.addEventListener("click", ev => {
  const alvo = ev.target.closest("[data-vista],[data-metrica],[data-etapa],[data-caso],[data-aba],[data-doc],[data-tabela],[data-micro],[data-etapa-avanca],[data-limpa-micro],[data-grupamento],#btn-unidades,#btn-limpar,#btn-cras,#btn-reiniciar,#btn-tema,#btn-ver-mapa");
  if (!alvo) return;
  const d = alvo.dataset;

  if (d.vista)    { estado.vista = d.vista; }
  else if (d.metrica) { estado.metrica = d.metrica; }
  else if (d.grupamento) { estado.grupamento = d.grupamento; }
  else if (d.etapa)   { estado.filtroEtapa = d.etapa; }
  else if (d.caso)    { estado.caso = d.caso; estado.vista = "casos"; estado.aba = "dados"; }
  else if (d.aba)     { estado.aba = d.aba; }
  else if (d.tabela)  { estado.tabelas[d.tabela] = !estado.tabelas[d.tabela]; }
  else if (d.micro !== undefined) { estado.microSel = estado.microSel === d.micro ? "" : d.micro; }
  else if (d.limpaMicro) { estado.microSel = ""; }
  else if (d.etapaAvanca){ estado.statusManual[estado.caso] = d.etapaAvanca; }
  else if (d.doc){
    const chave = estado.caso + ":" + d.doc;
    const c = acharCaso(estado.caso);
    const atual = Object.prototype.hasOwnProperty.call(estado.docsManual, chave)
      ? estado.docsManual[chave] : c.docs[d.doc];
    estado.docsManual[chave] = !atual;
  }
  else if (alvo.id === "btn-unidades"){ estado.mostrarUnidades = !estado.mostrarUnidades; }
  else if (alvo.id === "btn-limpar"){ estado.cre = ""; estado.unidade = ""; }
  else if (alvo.id === "btn-ver-mapa"){
    estado.microSel = acharCaso(estado.caso).micro;
    estado.cre = (M.porCod.get(estado.microSel) || {}).cre || "";
    estado.vista = "mapa";
  }
  else if (alvo.id === "btn-cras"){
    estado.statusManual[estado.caso] = "cras";
    (estado.eventosExtras[estado.caso] = estado.eventosExtras[estado.caso] || [])
      .push({ data:"agora", texto:"Encaminhado ao CRAS da região para busca ativa da família", tipo:"cras" });
  }
  else if (alvo.id === "btn-reiniciar"){
    estado.statusManual[estado.caso] = "contato";
    (estado.eventosExtras[estado.caso] = estado.eventosExtras[estado.caso] || [])
      .push({ data:"agora", texto:"Contato reiniciado manualmente pela equipe", tipo:"equipe" });
  }
  else if (alvo.id === "btn-tema"){ trocarTema(); return; }

  render();
});

document.addEventListener("change", ev => {
  if (ev.target.id === "sel-cre"){ estado.cre = ev.target.value; estado.unidade = ""; estado.microSel = ""; render(); }
  if (ev.target.id === "sel-unidade"){ estado.unidade = ev.target.value; render(); }
  if (ev.target.id === "sel-ponto"){ estado.ponto = ev.target.value; render(); }
});

/* ---- dica flutuante sobre o mapa ---- */
const dica = document.getElementById("dica");
function textoDica(cod){
  const m = M.porCod.get(cod);
  if (!m) return "";
  const par = (r, v) => `<dt>${esc(r)}</dt><dd>${esc(v)}</dd>`;
  return `<strong>Microárea ${esc(m.cod)}</strong><br>
    <span style="color:var(--ink-faint);">${esc(m.bairro)} · ${esc(m.cre)}ª CRE</span>
    <dl>
      ${par("Fila", fmt.format(m.espera))}
      ${par("Vagas ociosas", fmt.format(m.ociosas))}
      ${par("Demanda 1ª opção", fmt.format(m.demanda))}
      ${par("Confirmados", fmt.format(m.conf))}
      ${par("Perderam convocação", fmt.format(m.perdeu))}
      ${m.kmMediana !== null ? par("Vaga mais próxima", fmt1.format(m.kmMediana) + " km") : ""}
    </dl>`;
}
function esconderDica(){
  dica.classList.remove("visivel");
  dica.setAttribute("aria-hidden", "true");
}
document.addEventListener("scroll", esconderDica, { passive: true });
document.addEventListener("pointermove", ev => {
  const alvo = ev.target.closest ? ev.target.closest("circle[data-micro]") : null;
  if (!alvo){ esconderDica(); return; }
  dica.innerHTML = textoDica(alvo.dataset.micro);
  dica.classList.add("visivel"); dica.setAttribute("aria-hidden", "false");
  const r = dica.getBoundingClientRect();
  const x = Math.min(ev.clientX + 16, window.innerWidth - r.width - 10);
  const y = Math.min(ev.clientY + 16, window.innerHeight - r.height - 10);
  dica.style.left = Math.max(8, x) + "px";
  dica.style.top = Math.max(8, y) + "px";
});

/* ---- tema ---- */
function aplicarTema(t){
  document.documentElement.setAttribute("data-tema", t);
  const b = document.getElementById("btn-tema");
  if (b) b.textContent = t === "escuro" ? "Tema claro" : "Tema escuro";
  try { localStorage.setItem("creche-tema", t); } catch (_) {}
}
function trocarTema(){
  const atual = document.documentElement.getAttribute("data-tema");
  aplicarTema(atual === "escuro" ? "claro" : "escuro");
  render();   // as rampas são lidas do CSS: o mapa precisa ser redesenhado
}

/* ------------------------------------------------------------------ início */
(async function inicio(){
  let salvo = null;
  try { salvo = localStorage.getItem("creche-tema"); } catch (_) {}
  aplicarTema(salvo || (window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro"));

  const { dados, redeOk } = await carregarFontes();
  if (!dados.microareas.length){
    document.getElementById("conteudo").innerHTML =
      `<div class="cartao painel"><h3>Não consegui ler os CSVs</h3>
       <p class="legenda-painel">Nem pela rede nem pelos blocos embutidos. Sirva a pasta do repositório
       por HTTP (<code>python3 -m http.server</code>) e recarregue.</p></div>`;
    return;
  }
  M = construirModelo(dados);
  ancorarCasos();
  BANCO = await carregarBanco();
  const fonteBanco = BANCO.origem === "postgres" ? "Banco lido ao vivo."
    : BANCO.tabelas ? "Banco: retrato embutido (rode `make painel` para ler ao vivo)."
    : "Banco: sem leitura.";
  ORIGEM = (redeOk
    ? "Lendo os CSVs do disco a cada carregamento."
    : "CSVs embutidos na página (abra por HTTP para ler os arquivos do disco).")
    + " " + fonteBanco;
  document.getElementById("origem-dados").textContent = ORIGEM;
  render();
})();
</script>
