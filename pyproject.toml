[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creche-bot"
version = "0.1.0"
requires-python = ">=3.12"
# A única dependência de runtime é o driver do Postgres. Canal e conversa continuam
# stdlib pura, e `REPOSITORIO=memoria` roda o bot inteiro sem banco.
# Sem SQLAlchemy nem Alembic de propósito, ver creche_bot/dados/postgres.py.
dependencies = ["psycopg[binary,pool]>=3.2,<4"]

[project.optional-dependencies]
ia = ["anthropic>=1,<2"]          # só para a variação de linguagem do Claude
# Transcrição LOCAL de áudio: a voz da família não sai da máquina. Claude não recebe
# áudio, e mandar para um serviço de terceiros quebraria a regra de privacidade.
audio = ["faster-whisper>=1.0,<2"]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["creche_bot*", "fakes*"]

# Os CSVs do mapa territorial da fila viajam com o pacote: `BackendMapa` lê a oferta
# real deles, e sem isto uma instalação sem a árvore de fontes sobe sem creche nenhuma.
[tool.setuptools.package-data]
creche_bot = ["MapaFilaCreche/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
