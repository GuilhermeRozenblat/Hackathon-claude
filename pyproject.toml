[project]
name = "creche-bot"
version = "0.1.0"
requires-python = ">=3.12"
# Rodar o bot NÃO exige dependência: canal, banco e conversa usam só a stdlib.
dependencies = []

[project.optional-dependencies]
ia = ["anthropic>=0.40"]          # só para a variação de linguagem do Claude
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.13"]  # Trilha D1
dev = ["pytest>=8", "ruff>=0.7", "pydantic>=2.9"]

[tool.setuptools.packages.find]
include = ["creche_bot*", "fakes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
